name: Validate ESP32 Firmware

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile ESP32 (no hardware, no flash)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: espressif/idf:v5.5.5
    steps:
      - name: Checkout firmware
        uses: actions/checkout@v6

      - name: Validate ESP-IDF toolchain
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py --version

      - name: Compile firmware for ESP32
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py build
